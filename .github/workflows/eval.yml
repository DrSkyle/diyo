name: eval

# Scores a LoRA adapter against the 30-case benchmark. Defaults to Diyo-1 on Qwen3.5-2B;
# override the inputs to score the same data on the Himalaya Gemma 4 base.

on:
  workflow_dispatch:
    inputs:
      lora_dir:
        description: Adapter directory in the repo
        default: artifacts/diyo-1-lora
      base_url:
        description: GGUF URL for the base model
        default: https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf
      base_model_id:
        description: HF repo id for the base (used for the LoRA conversion)
        default: unsloth/Qwen3.5-2B
      model_name:
        description: Label used in the results
        default: diyo-1-lora
  push:
    paths:
      - "evals/**"
      - "artifacts/**"
      - ".github/workflows/eval.yml"

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LORA_DIR: ${{ inputs.lora_dir || 'artifacts/diyo-1-lora' }}
      BASE_URL: ${{ inputs.base_url || 'https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf' }}
      BASE_MODEL_ID: ${{ inputs.base_model_id || 'unsloth/Qwen3.5-2B' }}
      MODEL_NAME: ${{ inputs.model_name || 'diyo-1-lora' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers gguf safetensors sentencepiece

      - name: Base weights
        run: |
          curl -L --retry 3 -o base.gguf "$BASE_URL"
          ls -lh base.gguf

      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build -j4 --target llama-server

      - name: Convert the LoRA to GGUF
        run: |
          python llama.cpp/convert_lora_to_gguf.py "$LORA_DIR" \
            --base-model-id "$BASE_MODEL_ID" \
            --outfile adapter.gguf --outtype f16
          ls -lh adapter.gguf

      - name: Serve base + adapter
        run: |
          nohup ./llama.cpp/build/bin/llama-server \
            -m base.gguf --lora adapter.gguf \
            --port 8080 -c 2048 -t 4 --no-webui --reasoning off \
            > server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then echo "ready after ${i}s"; exit 0; fi
            sleep 2
          done
          tail -30 server.log; exit 1

      - name: Score against the 30 cases
        run: |
          set +e
          python3 evals/run_eval.py --endpoint http://127.0.0.1:8080/v1 \
            --model "$MODEL_NAME" --fresh | tee result.txt
          echo "---- summary ----"
          grep -E "passed|BLOCKING" result.txt || true
          exit 0
