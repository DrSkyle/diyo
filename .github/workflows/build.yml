name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK and sdkmanager. Install only what we
      # need; do not use android-actions/setup-android, which requests a `tools`
      # package that no longer exists.
      - name: Install Android components
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Show output
        run: ls -lh app/build/outputs/apk/debug/

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consent pipeline end-to-end
        run: python3 pipeline/test_pipeline.py
      - name: Eval set is valid
        run: python3 evals/run_eval.py --dry-run
