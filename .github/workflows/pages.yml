name: site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Branch deploy, not an artifact deploy: this account is out of Actions
      # artifact storage, and publishing three files should not need a bucket.
      - name: Publish site to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "diyo-bot"
          git config user.email "bot@devilabs.dev"
          git add -A
          git commit -q -m "site: publish devilabs.dev"
          git push -q -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
